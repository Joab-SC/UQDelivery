<mat-card class="tarjeta" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Iniciar sesión</mat-card-title>
    <mat-card-subtitle>Ingresa con tu correo y contraseña</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form class="formulario" [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>
      <mat-form-field>
        <mat-label>Correo</mat-label>
        <input matInput type="email" formControlName="correo" autocomplete="email" />
        <mat-error>
          @if (formulario.controls.correo.hasError('required')) {
            El correo es obligatorio
          } @else {
            El formato del correo no es válido
          }
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="contrasena" autocomplete="current-password" />
        <mat-error>La contraseña es obligatoria</mat-error>
      </mat-form-field>

      <!-- HU-03: enlace a la recuperación de contraseña -->
      <a class="olvido" routerLink="/recuperar">¿Olvidaste tu contraseña?</a>

      <app-mensaje-error [mensaje]="error()" />

      <button mat-flat-button type="submit" [disabled]="cargando()">
        @if (cargando()) {
          Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <p class="pie">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </mat-card-content>
</mat-card>
