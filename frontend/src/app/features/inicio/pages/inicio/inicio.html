<section class="pagina">
  <header class="encabezado-pagina">
    <h1 class="titulo-pagina">Hola, {{ auth.usuario()?.nombre }}</h1>
    <p class="subtitulo-pagina">Bienvenido a UQDelivery. Entraste con el rol {{ auth.rol() }}.</p>
  </header>

  <mat-card class="tarjeta" appearance="outlined">
    <mat-card-header>
      <mat-icon matCardAvatar class="icono-tarjeta">dns</mat-icon>
      <mat-card-title>Estado de la API</mat-card-title>
      <mat-card-subtitle>GET /api/health</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (cargando()) {
        <app-cargando texto="Consultando la API..." />
      } @else if (estadoApi()) {
        <p class="estado-ok">
          <mat-icon>check_circle</mat-icon>
          La API responde: {{ estadoApi() }}
        </p>
      }
      <app-mensaje-error [mensaje]="error()" />
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="consultarEstado()" [disabled]="cargando()">
        <mat-icon>refresh</mat-icon>
        Volver a consultar
      </button>
    </mat-card-actions>
  </mat-card>
</section>
