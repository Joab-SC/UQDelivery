# Los valores salen del .env de la raíz del repo (el backend corre desde backend/, por eso ../.env).
# Si una variable no existe, se usa el valor que va después de los dos puntos.
spring:
  application:
    name: uqdelivery
  config:
    import: optional:file:../.env[.properties]

  # En local no se pone DB_URL: se arma con el PostgreSQL de Docker.
  # En el despliegue DB_URL apunta a Neon (jdbc:postgresql://<host>/<base>?sslmode=require).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:uqdelivery}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # En local (DDL_AUTO sin poner = create-drop) la base se crea desde cero en cada arranque:
  # crea las tablas a partir de las entidades (y las borra al apagar) y luego ejecuta data.sql.
  # En el despliegue DDL_AUTO=update: las tablas y los datos se conservan; solo se agregan
  # las tablas y columnas nuevas. data.sql se ejecuta igual, pero no duplica nada (ON CONFLICT).
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Render asigna el puerto con la variable PORT; en local es 8080.
server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:clave-local-de-desarrollo-uqdelivery-no-usar-en-produccion}
    expiracion-minutos: ${JWT_EXP:120}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@uqdelivery.co}
    # true SOLO en local: si MAIL_USER está vacío, el correo se escribe en la consola en vez de enviarse.
    # En producción debe quedar en false (el valor por defecto) para que ningún enlace termine en los logs.
    modo-consola: ${MAIL_MODO_CONSOLA:false}
