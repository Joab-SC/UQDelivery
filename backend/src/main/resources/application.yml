# Los valores salen del .env de la raíz del repo (el backend corre desde backend/, por eso ../.env).
# Si una variable no existe, se usa el valor que va después de los dos puntos.
spring:
  application:
    name: uqdelivery
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:uqdelivery}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Cada vez que arranca el back la base se crea desde cero:
  # create-drop crea las tablas a partir de las entidades (y las borra al apagar),
  # y luego se ejecuta src/main/resources/data.sql con los datos de prueba.
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:clave-local-de-desarrollo-uqdelivery-no-usar-en-produccion}
    expiracion-minutos: ${JWT_EXP:120}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@uqdelivery.co}
    # true SOLO en local: si MAIL_USER está vacío, el correo se escribe en la consola en vez de enviarse.
    # En producción debe quedar en false (el valor por defecto) para que ningún enlace termine en los logs.
    modo-consola: ${MAIL_MODO_CONSOLA:false}
