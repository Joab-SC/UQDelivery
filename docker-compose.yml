# PostgreSQL local. Toma los valores del archivo .env de la raíz.
# Levantar: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: uqdelivery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
